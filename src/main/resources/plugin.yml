name: SimpleEconomyPlugin
version: 1.0.0
main: com.example.simpleeconomy.SimpleEconomyPlugin
api-version: '26.2'
description: Simple economy with an auction house, buy orders, and fixed-price /sell. Gives Java players dialogs and Bedrock players chest/anvil menus.
prefix: Simple Economy Plugin
softdepend: [PlaceholderAPI, floodgate, Geyser-Spigot, Geyser]
commands:
  balance:
    aliases: [bal, money]
    description: Check your balance
  pay:
    description: Pay another player
  baltop:
    description: Richest players
  eco:
    description: Admin economy commands
    permission: simpleeconomy.admin
  ah:
    aliases: [auction, auctionhouse]
    description: Open the auction house
  sell:
    description: Sell items for their fixed base price
  orders:
    aliases: [order]
    description: Buy orders
  esettings:
    aliases: [ecosettings]
    description: Your personal Simple Economy settings (confirm screens, menu style)
permissions:
  simpleeconomy.admin:
    default: op
